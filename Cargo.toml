[package]
name = "varmint"
version = "0.1.0"
edition = "2024"

[dependencies]
applevisor = "1.0"
applevisor-sys = "1.0.0"
coreaudio-rs = "0.14.2"
libc = "0.2"
crossterm = "0.29.0"
num_enum = "0.7.6"
rtrb = "0.3.4"
vmnet = "0.5.1"
winit = "0.30.13"
zerocopy = { version = "0.8.50", features = ["derive"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "objc2-io-surface",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-graphics",
    "objc2-metal",
] }
raw-window-handle = "0.6"
raw-window-metal = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
vm-fdt = "0.3.0"
zstd = "0.13"
